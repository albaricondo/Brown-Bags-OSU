name: Sync signup issues

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'signup')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Append issue data to signups file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body || '';
            const path = 'data/signups.json';

            function extract(label) {
              const pattern = new RegExp(`### ${label}\\s+([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(pattern);
              return match ? match[1].trim() : '';
            }

            const signup = {
              issueNumber: context.payload.issue.number,
              name: extract('Name'),
              role: extract('Role'),
              email: extract('Email'),
              affiliation: extract('Affiliation'),
              interests: extract('Preferred topics or talk ideas'),
              notes: extract('Notes'),
              status: 'Pending',
              createdAt: context.payload.issue.created_at,
            };

            const rows = JSON.parse(fs.readFileSync(path, 'utf8'));
            rows.unshift(signup);
            fs.writeFileSync(path, `${JSON.stringify(rows, null, 2)}\n`);

      - name: Commit updated table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signups.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add signup #${{ github.event.issue.number }}"
          git push